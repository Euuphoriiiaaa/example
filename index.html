<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vox Angelica</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;font-size:19px;color:#0f2350;background:linear-gradient(160deg,#ffffff 0%,#fbf3dc 42%,#dce8fb 100%) fixed;min-height:100vh}
.card{background:rgba(255,255,255,.88);border:1px solid rgba(201,162,75,.45);border-radius:1.1rem;padding:1.6rem;box-shadow:0 4px 18px rgba(201,162,75,.15)}
.btn{background:linear-gradient(135deg,#f0d98f,#c9a24b);color:#0f2350;font-weight:600;padding:.8rem 1.5rem;border-radius:.7rem;font-size:1.1rem}
.btn.big{font-size:1.5rem;padding:1.1rem 3rem}
.btn2{border:1px solid #c9a24b;color:#7a5a14;background:#fffdf5;padding:.5rem 1.1rem;border-radius:.6rem;font-size:1.05rem}
.inp{background:#fff;border:1px solid #d9c690;border-radius:.6rem;padding:.8rem 1rem;color:#0f2350;font-size:1.1rem}
.inp:focus,.btn:focus-visible,.btn2:focus-visible{outline:2px solid #c9a24b}
.badge{padding:.2rem .8rem;border-radius:99px;font-size:.9rem;font-weight:600}
.g{background:#dcfce7;color:#166534}.y{background:#fef3c7;color:#92400e}.r{background:#fee2e2;color:#991b1b}
table{width:100%;font-size:1.1rem}td,th{padding:.7rem .7rem;text-align:left;border-bottom:1px solid #efe3c4}th{color:#7a5a14}
h2{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:700;color:#8a6516;margin-bottom:.5rem}
.tab{padding:.65rem 1.3rem;border-radius:99px;font-size:1.1rem;white-space:nowrap;color:#4b5d86;background:rgba(255,255,255,.6)}
.tab.on{background:linear-gradient(135deg,#f0d98f,#c9a24b);color:#0f2350;font-weight:600}
.text-amber-200{color:#9a7420!important}.text-slate-300,.text-slate-400{color:#4b5d86!important}
.border-blue-900{border-color:#e8dcc0!important}.bg-blue-950{background:#fbf6e8!important}
@media(max-width:640px){
body{font-size:16.5px}
.card{padding:1rem;border-radius:.9rem}
h2{font-size:1.5rem}
form .inp,form .btn,.btn.big{width:100%}
.btn.big{font-size:1.35rem;padding:1.1rem 1rem}
.btn2{padding:.55rem .9rem}
.inp{font-size:1rem}
table{font-size:.95rem}td,th{padding:.55rem .5rem;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;background:#fffdf5;z-index:1}
.tab{padding:.6rem 1rem;font-size:1rem}
.text-6xl{font-size:2.6rem!important;line-height:1!important}
.text-5xl{font-size:2.1rem!important;line-height:1.1!important}
}
html{-webkit-text-size-adjust:100%}main{min-width:0}
</style></head>
<body><div id="app"></div><div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gold-500 hidden px-4 py-2 rounded-lg text-sm" style="background:#e8cf8c;color:#0a1733"></div>
<script>
/* ===== Konfigurasi & helper ===== */
const KAS=10000,DUKA=20000,SAKIT=10000,Y=new Date().getFullYear();
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS=BLN.map((_,i)=>`${Y}-${String(i+1).padStart(2,'0')}`);
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+n.toLocaleString('id-ID'),fmt=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3500)};
const badge=t=>`<span class="badge ${{LUNAS:'g',DISETUJUI:'g',HADIR:'g',BERLANGSUNG:'g',SELESAI:'g',MENUNGGU:'y',TERJADWAL:'y',IZIN:'y',DUKA:'y',BELUM:'r',DITOLAK:'r',SAKIT:'r'}[t]||'y'}">${t}</span>`;
const tbl=(h,rows)=>`<div class="overflow-x-auto"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const stat=(l,v)=>`<div class="card"><div class="font-serif text-6xl text-amber-200">${v}</div><div class="text-sm text-slate-300">${l}</div></div>`;
const fileLink=(p,n)=>p?.startsWith('data:image')?`<a href="${p}" download="${esc(n)}"><img src="${p}" class="max-h-40 rounded-lg my-2"></a>`:`<a class="underline text-amber-200" href="${p}" download="${esc(n)}">Unduh ${esc(n)}</a>`;
const empty=t=>`<p class="text-sm text-slate-400">${t}</p>`;

/* ===== Data (demo: localStorage. Produksi: ganti ke Supabase, lihat schema.sql) ===== */
function seed(){const d=new Date().toISOString().slice(0,10);return{
users:[{id:'bph',name:'BPH Vox Angelica',email:'',phone:'-',pass:'VoxAngelica2026',role:'BPH',status:'Aktif'}],
sessions:[],att:[],kas:[],songs:[],agenda:[],ann:[],social:[]}}
let db=JSON.parse(localStorage.getItem('vox2')||'null')||seed(),me=sessionStorage.getItem('voxme'),tab='home',reg=false;
const save=()=>{try{localStorage.setItem('vox2',JSON.stringify(db))}catch(e){toast('Penyimpanan penuh, gunakan file lebih kecil')}};
const cur=()=>db.users.find(u=>u.id===me),isB=()=>cur()?.role==='BPH',nm=id=>esc(db.users.find(u=>u.id===id)?.name||'-');
const kasOf=(u,m)=>db.kas.find(k=>k.uid===u&&k.m===m),mem=()=>db.users.filter(u=>u.role==='ANGGOTA');
(function mig(){db.ann=db.ann||[];(db.agenda||[]).forEach(a=>db.ann.push({id:uid(),type:a.type,title:a.title,date:a.date,place:a.place,body:'',at:a.date}));db.agenda=[];
db.ann.forEach(a=>{a.id=a.id||uid();a.type=a.type||'Pengumuman'});
db.sessions.forEach(x=>{const a=db.ann.find(y=>y.sid===x.id)||db.ann.find(y=>!y.sid&&y.type==='Latihan'&&y.date===x.date);if(a)a.sid=x.id;else db.ann.push({id:uid(),type:'Latihan',title:x.title,date:x.date,place:'',body:'',at:x.date,sid:x.id})});
db.ann.filter(a=>a.type==='Latihan'&&!a.sid&&a.date).forEach(a=>{const x={id:uid(),title:a.title,date:a.date,status:'TERJADWAL'};db.sessions.push(x);a.sid=x.id});save()})();

async function notify(subject,body){if(!mem().some(u=>u.email))return toast('Isi email anggota di Master Data agar notifikasi terkirim');try{const r=await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({subject,to:mem().map(u=>u.email).filter(Boolean),html:`<div style="font-family:Arial,sans-serif"><h2>${esc(subject)}</h2>${body}<p>Salam, BPH Vox Angelica</p></div>`})});
toast(r.ok?'Notifikasi email terkirim ke seluruh anggota':'Email belum terkirim, periksa RESEND_API_KEY')}catch{toast('Email belum terkirim (API belum aktif)')}}

/* ===== Aksi ===== */
const Au={go(e){const d=fd(e),n=d.name.trim().toLowerCase();if(reg){if(db.users.some(u=>u.name.toLowerCase()===n))return toast('Nama sudah terdaftar, tambahkan nama belakang');
const u={id:uid(),name:d.name.trim(),email:'',phone:d.phone,pass:d.pass,role:'ANGGOTA',status:'Aktif'};db.users.push(u);save();me=u.id}
else{const u=db.users.find(u=>u.name.toLowerCase()===n&&u.pass===d.pass);if(!u)return toast('Nama atau kata sandi salah');me=u.id}
sessionStorage.setItem('voxme',me);showAuth=false;render()},
out(){sessionStorage.removeItem('voxme');me=null;tab='home';render()},
open(r){reg=r;showAuth=true;render()},
email(id,v){db.users.find(u=>u.id===id).email=v.trim();save();toast('Email disimpan')}};
const A={add(e){const d=fd(e);db.sessions.unshift({id:uid(),title:d.title,date:d.date,status:'TERJADWAL'});save();render();
notify('Jadwal latihan baru: '+d.title,`<p>${esc(d.title)} pada ${fmt(d.date)}.</p>`)},
set(id,st){db.sessions.find(s=>s.id===id).status=st;save();render()},
mark(sid,st){if(!cur())return askLogin();if(db.sessions.find(s=>s.id===sid)?.status!=='BERLANGSUNG')return toast('Absensi belum dibuka BPH');
if(db.att.find(a=>a.sid===sid&&a.uid===me&&a.ap==='DISETUJUI'))return toast('Absensi Anda sudah disetujui BPH');
db.att=db.att.filter(a=>!(a.sid===sid&&a.uid===me));db.att.push({sid,uid:me,status:st,ap:'MENUNGGU',time:new Date().toISOString()});save();toast('Absensi terkirim, menunggu persetujuan BPH');render()},
ap(sid,u,v){const a=db.att.find(x=>x.sid===sid&&x.uid===u);if(a){a.ap=v;save();render()}},
okAll(sid){db.att.filter(a=>a.sid===sid&&a.ap==='MENUNGGU').forEach(a=>a.ap='DISETUJUI');save();render()}};
const K={async up(e){const d=fd(e),f=e.target.file.files[0];if(d.how==='TRANSFER'&&!f)return toast('Pilih foto bukti transfer');if(f&&f.size>1.5e6)return toast('Ukuran maksimal 1,5 MB');
let k=kasOf(me,d.m);if(!k)db.kas.push(k={uid:me,m:d.m});k.st='MENUNGGU';k.how=d.how;k.proof=f?await rd(f):'';k.fn=f?f.name:'';save();toast('Konfirmasi terkirim, menunggu approval BPH');render()},
tog(u,m){let k=kasOf(u,m);if(!k)db.kas.push(k={uid:u,m,st:'BELUM'});k.st=k.st==='LUNAS'?'BELUM':'LUNAS';if(k.st==='LUNAS'&&!k.how)k.how='TUNAI';save();render()},
set(u,m,st){kasOf(u,m).st=st;save();render()}};
const S={async add(e){const d=fd(e),f=e.target.file.files[0];if(!f&&!d.video)return toast('Isi file teks/partitur atau link video');if(f&&f.size>1.5e6)return toast('Ukuran maksimal 1,5 MB');
db.songs.unshift({id:uid(),title:d.title,note:d.note,video:d.video.trim(),file:f?await rd(f):'',fn:f?f.name:''});save();render()}};
const G={add(e){const d=fd(e),t=d.type;if(t!=='Pengumuman'&&!d.date)return toast('Isi tanggalnya dulu');
const a={id:uid(),type:t,title:d.title,body:d.body||'',date:d.date||'',place:d.place||'',at:new Date().toISOString().slice(0,10)};
if(t==='Latihan'){const x={id:uid(),title:d.title,date:d.date,status:'TERJADWAL'};db.sessions.unshift(x);a.sid=x.id}
db.ann.unshift(a);save();render();notify((t==='Pengumuman'?'Pengumuman: ':t+': ')+d.title,`<p>${d.date?fmt(d.date)+' ':''}${d.place?'di '+esc(d.place)+'.':''}</p>${d.body?`<p>${esc(d.body)}</p>`:''}`)},
del(id){const a=db.ann.find(x=>x.id===id);if(!a||!confirm('Hapus "'+a.title+'"?'+(a.sid?' Absensi latihan ini juga ikut terhapus.':'')))return;
if(a.sid){db.sessions=db.sessions.filter(x=>x.id!==a.sid);db.att=db.att.filter(x=>x.sid!==a.sid)}db.ann=db.ann.filter(x=>x.id!==id);save();render()}};
const D={add(e){const d=fd(e);db.social.unshift({id:uid(),type:d.type,who:d.who,note:d.note,visit:d.visit,amount:d.type==='DUKA'?DUKA:SAKIT,paid:[],wait:[]});save();render()},
tog(id,u){const c=db.social.find(x=>x.id===id);c.paid=c.paid.includes(u)?c.paid.filter(x=>x!==u):[...c.paid,u];c.wait=(c.wait||[]).filter(x=>x!==u);save();render()},
pay(id){if(!cur())return askLogin();const c=db.social.find(x=>x.id===id);c.wait=c.wait||[];if(!c.paid.includes(me)&&!c.wait.includes(me))c.wait.push(me);save();render()},
ap(id,u,v){const c=db.social.find(x=>x.id===id);c.wait=(c.wait||[]).filter(x=>x!==u);if(v==='ok'&&!c.paid.includes(u))c.paid.push(u);save();render()},
remind(id){const c=db.social.find(x=>x.id===id),n=mem().filter(u=>!c.paid.includes(u.id)).map(u=>esc(u.name)).join(', ');
notify(`Pengingat patungan ${c.type} ${c.who}`,`<p>Iuran ${rp(c.amount)}. Yang belum: ${n||'semua sudah'}.</p>`)}};

function exportXlsx(){const wb=XLSX.utils.book_new(),U=mem(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n);
add('Uang Kas',U.map(u=>{const r={Nama:u.name};MONTHS.forEach((m,i)=>r[BLN[i]]=kasOf(u.id,m)?.st==='LUNAS'?'LUNAS':'BELUM');r['Total Lunas']=MONTHS.filter(m=>kasOf(u.id,m)?.st==='LUNAS').length;return r}));
add('Kehadiran',db.sessions.flatMap(s=>U.map(u=>({Tanggal:s.date,Latihan:s.title,Nama:u.name,Status:db.att.find(a=>a.sid===s.id&&a.uid===u.id)?.status||'Belum absen',Persetujuan:db.att.find(a=>a.sid===s.id&&a.uid===u.id)?.ap||'-'}))));
add('Dana Sosial',db.social.flatMap(c=>U.map(u=>({Jenis:c.type,Penerima:c.who,Kunjungan:c.visit,Nominal:c.amount,Anggota:u.name,Patungan:c.paid.includes(u.id)?'Sudah bayar':'Belum bayar'}))));
add('Master Anggota',U.map(u=>({Nama:u.name,Email:u.email,'No. HP':u.phone,Peran:u.role,Status:u.status})));
add('Rekap Latihan '+rm,U.map(u=>{const w=wkn(u.id,rm);return{Nama:u.name,'Minggu 1':w[0],'Minggu 2':w[1],'Minggu 3':w[2],'Minggu 4':w[3],Total:w.reduce((a,b)=>a+b,0),Target:TARGET}}));
XLSX.writeFile(wb,`VoxAngelica_Rekap_${new Date().toISOString().slice(0,10)}.xlsx`)}

/* ===== Rekap & chart latihan ===== */
const LPM=2,TARGET=LPM*4,nowYM=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')};
let rm=nowYM();
const apB=v=>`<span class="badge ${v==='DISETUJUI'?'g':v==='DITOLAK'?'r':'y'}">${{MENUNGGU:'Waiting',DISETUJUI:'Approved',DITOLAK:'Rejected'}[v]||v}</span>`;
const sdate=a=>db.sessions.find(s=>s.id===a.sid)?.date||'';
const hadir=(u,ym)=>db.att.filter(a=>a.uid===u&&a.status==='HADIR'&&a.ap==='DISETUJUI'&&sdate(a).startsWith(ym));
const wkn=(u,ym)=>[1,2,3,4].map(w=>hadir(u,ym).filter(a=>Math.min(4,Math.ceil(+sdate(a).slice(8,10)/7))===w).length);
const bar=(v,max)=>`<div class="h-3 rounded-full overflow-hidden" style="background:#f3e6c0"><div class="h-3 rounded-full" style="width:${Math.min(100,v/max*100)}%;background:linear-gradient(90deg,#c9a24b,#3b6fd4)"></div></div>`;
function bphRekap(){return `<div class="card mt-5"><div class="flex flex-wrap justify-between items-center gap-2"><h2>Rekap latihan per anggota</h2><input type="month" class="inp" value="${rm}" onchange="rm=this.value||rm;render()"></div>
<p class="text-sm text-slate-300 mb-2">Target ${LPM}x per minggu, ${TARGET}x per bulan. Hanya absen Hadir yang sudah Approved yang dihitung.</p>
${mem().length?tbl(['Anggota','Mgg 1','Mgg 2','Mgg 3','Mgg 4','Total','Capaian'],mem().map(u=>{const w=wkn(u.id,rm),t=w.reduce((a,b)=>a+b,0);return [esc(u.name),...w.map(x=>`${x}/${LPM}`),`<b>${t}/${TARGET}</b>`,`<div style="min-width:110px">${bar(t,TARGET)}</div>`]})):empty('Belum ada anggota terdaftar.')}</div>`}
function myChart(id){const n=new Date(),ms=[5,4,3,2,1,0].map(i=>{const d=new Date(n.getFullYear(),n.getMonth()-i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}),vals=ms.map(m=>hadir(id,m).length),w=wkn(id,ms[5]);
return `<div class="card mt-5"><h2>Rekap kehadiran saya</h2><p class="text-sm text-slate-300 mb-3">Latihan Approved per bulan (target ${TARGET}x, ${LPM}x per minggu)</p>
<div class="flex items-end gap-3" style="height:170px">${vals.map((v,i)=>`<div class="flex-1 flex flex-col items-center justify-end h-full"><span class="text-sm font-semibold mb-1">${v}</span><div class="w-full rounded-t-lg" style="height:${Math.max(3,Math.min(100,v/TARGET*100))*1.2}px;background:linear-gradient(180deg,#3b6fd4,#c9a24b)"></div><span class="text-xs mt-1 text-slate-300">${BLN[+ms[i].slice(5)-1]}</span></div>`).join('')}</div>
<p class="text-sm mt-4 mb-1">Bulan ini: <b>${vals[5]}/${TARGET}</b></p>${bar(vals[5],TARGET)}
<div class="grid grid-cols-4 gap-2 mt-3">${w.map((x,i)=>`<div class="rounded-lg p-2 text-center" style="background:#fbf6e8"><div class="text-xs text-slate-300">Minggu ${i+1}</div><b>${x}/${LPM}</b></div>`).join('')}</div></div>`}

/* ===== Mode tamu (tanpa login) ===== */
const PROT=[];let showAuth=false;
const vid=u=>{if(!u||!/^https?:\/\//i.test(u))return '';const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
return m?`<iframe class="rounded-xl my-2" style="width:100%;max-width:640px;aspect-ratio:16/9;border:0" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:`<p class="my-2"><a class="btn2" href="${esc(u)}" target="_blank" rel="noopener">Buka video rekaman</a></p>`};
function askLogin(){showAuth=true;reg=false;render();window.scrollTo&&window.scrollTo(0,0)}
function go(k){if(PROT.includes(k)&&!cur())return askLogin();tab=k;render()}
function jadwalCard(){const ss=db.sessions.filter(s=>s.status!=='SELESAI').sort((a,b)=>a.date>b.date?1:-1);
return `<div class="card mt-5"><h2>Jadwal latihan</h2>${ss.map(s=>`<div class="flex flex-wrap items-center gap-3 border-b border-blue-900 py-3"><b class="text-lg">${esc(s.title)}</b><span class="text-slate-300">${fmt(s.date)}</span>${badge(s.status)}</div>`).join('')||empty('Belum ada jadwal latihan.')}</div>`}
function guestHome(){return `<h1 class="font-serif text-5xl text-amber-200 mb-4">Selamat datang di Vox Angelica</h1>${feedCard()}`}

/* ===== Pengumuman + agenda + absen dalam satu feed ===== */
const today=()=>nowYM()+'-'+String(new Date().getDate()).padStart(2,'0');
const sessAct=x=>{if(isB())return x.status==='TERJADWAL'?`<button class="btn mt-2" onclick="A.set('${x.id}','BERLANGSUNG')">Mulai latihan</button>`:x.status==='BERLANGSUNG'?`<button class="btn2 mt-2" onclick="A.set('${x.id}','SELESAI')">Selesaikan</button> <button class="btn2 mt-2" onclick="A.okAll('${x.id}')">Approve semua yang waiting</button>`:'';
if(x.status!=='BERLANGSUNG')return '';const m=db.att.find(a=>a.sid===x.id&&a.uid===me);
return `<div class="flex flex-wrap items-center gap-3 mt-2"><button class="btn" ${m?.ap==='DISETUJUI'?'disabled style="opacity:.6"':''} onclick="A.mark('${x.id}','HADIR')">Hadir</button>${m?apB(m.ap)+(m.status!=='HADIR'?' '+badge(m.status):''):''}<button class="btn2" onclick="A.mark('${x.id}','IZIN')">Izin</button><button class="btn2" onclick="A.mark('${x.id}','SAKIT')">Sakit</button></div>`};
const feedItem=a=>{const x=a.sid&&db.sessions.find(y=>y.id===a.sid);
return `<div class="border-b border-blue-900 py-3"><div class="flex flex-wrap items-center gap-2"><b class="text-lg">${esc(a.title)}</b>${a.type!=='Pengumuman'?badge(a.type.toUpperCase()):''}${x?badge(x.status):''}</div>
${a.date?`<p class="text-slate-300">${fmt(a.date)}${a.place?' - '+esc(a.place):''}</p>`:`<p class="text-sm text-slate-400">${fmt(a.at)}</p>`}${a.body?`<p class="mt-1">${esc(a.body)}</p>`:''}${x?sessAct(x):''}${isB()?`<div><button class="btn2 mt-2" onclick="G.del('${a.id}')">Hapus</button></div>`:''}</div>`};
function feedSorted(){const td=today(),act=a=>db.sessions.find(x=>x.id===a.sid)?.status==='BERLANGSUNG',up=a=>a.date&&a.date>=td&&!act(a);
return [...db.ann.filter(act),...db.ann.filter(up).sort((x,y)=>x.date>y.date?1:-1),...db.ann.filter(a=>!act(a)&&!up(a)).sort((x,y)=>(x.date||x.at)<(y.date||y.at)?1:-1)]}
const feedCard=()=>`<div class="card mt-5"><h2>Pengumuman dan agenda</h2>${feedSorted().map(feedItem).join('')||empty('Belum ada pengumuman.')}</div>`;
